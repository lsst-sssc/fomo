
repos:
    # Compare the local template version to the latest remote template version
    # This hook should always pass. It will print a message if the local version 
    # is out of date.
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: check-lincc-frameworks-template-version
        name: Check template version
        description: Compare current template version against latest
        verbose: true
    # Clear output from jupyter notebooks so that only the input cells are committed.
  - repo: local
    hooks:
      - id: jupyter-nb-clear-output
        name: Clear output from Jupyter notebooks
        description: Clear output from Jupyter notebooks.
        files: \.ipynb$
        exclude: ^docs/notebooks/pre_executed
        stages: [pre-commit]
        language: system
        entry: jupyter nbconvert --clear-output
    # Prevents committing directly branches named 'main' and 'master'.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: no-commit-to-branch
        name: Prevent main branch commits
        description: Prevent the user from committing directly to the primary branch.
      - id: check-added-large-files
        name: Check for large files
        description: Prevent the user from committing very large files.
        args: ['--maxkb=500']
    # Verify that pyproject.toml is well formed
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: Verify that pyproject.toml adheres to the established schema.
    # Verify that GitHub workflows are well formed
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      - id: ruff
        name: Lint code using ruff; sort and organize imports 
        types_or: [ python, pyi ]
        args: ["--fix"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      - id: ruff-format
        name: Format code using ruff
        types_or: [ python, pyi, jupyter ]
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: pre-executed-nb-never-execute
        name: Check pre-executed notebooks
        files: ^docs/notebooks/pre_executed/.*\.ipynb$
        verbose: true
        args:
          ["docs/notebooks/pre_executed/"]
    # Run the Django test suite (the only test runner for this project), skipping
    # the Playwright browser tests tagged 'functional', which CI runs separately.
    # Unlike the template's pytest hook there is no collection guard: an import
    # error in a test module makes `manage.py test` exit non-zero and fail the hook.
    # TestEphemeris (solsys_code/tests/test_views.py) is tagged 'ephemeris_segfault'
    # because the native ASSIST integrator crashes the whole test process, so it is
    # excluded here and in CI.
    # The suite runs with `--parallel` (one worker per CPU) and each worker writes its own
    # coverage file, merged by `coverage combine`; `coverage erase` first drops files an
    # interrupted run left behind.
    # This hook takes about 10 minutes; for work-in-progress commits use
    # `SKIP=django-test git commit ...`.
  - repo: local
    hooks:
      - id: django-test
        name: Run Django unit tests in parallel (excluding functional and ephemeris_segfault)
        description: Run the Django test suite in parallel worker processes with combined coverage, skipping the 'functional' Playwright tests and the 'ephemeris_segfault' class.
        entry: bash -c "coverage erase && coverage run manage.py test --exclude-tag functional --exclude-tag ephemeris_segfault --parallel && coverage combine -q && coverage html"
        language: system
        pass_filenames: false
        always_run: true
