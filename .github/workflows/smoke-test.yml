# This workflow will run daily at 06:45.
# It will install Python dependencies and run tests with a variety of Python versions.
# See documentation for help debugging smoke test issues:
#    https://lincc-ppt.readthedocs.io/en/latest/practices/ci_testing.html#version-culprit

name: Unit test smoke test

on:

  # Runs this workflow automatically
  schedule:
    - cron: 45 6 * * *
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache SPICE kernels
      # Same key as testing-and-coverage.yml: this daily run on main keeps the cache from expiring.
      uses: actions/cache@v6
      with:
        path: ~/.cache/sorcha
        key: sorcha-kernels-v1
    - name: Seed MPC observatory codes
      # sorcha only downloads ObsCodes.json from minorplanetcenter.net when it is missing from its
      # cache, and MPC intermittently drops connections from GitHub runners; seed it from the repo.
      run: |
        mkdir -p ~/.cache/sorcha
        [ -f ~/.cache/sorcha/ObsCodes.json ] || gunzip -c solsys_code/tests/data/ObsCodes.json.gz > ~/.cache/sorcha/ObsCodes.json
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: List dependencies
      run: |
        pip list
    - name: Run Django unit tests
      run: |
        python manage.py test --exclude-tag functional
