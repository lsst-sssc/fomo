
# This workflow will install Python dependencies, run tests and report code coverage with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit test and code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache SPICE kernels
      uses: actions/cache@v6
      with:
        path: ~/.cache/sorcha
        key: sorcha-kernels-v1
    - name: Seed MPC observatory codes
      # sorcha only downloads ObsCodes.json from minorplanetcenter.net when it is missing from its
      # cache, and MPC intermittently drops connections from GitHub runners; seed it from the repo.
      run: |
        mkdir -p ~/.cache/sorcha
        [ -f ~/.cache/sorcha/ObsCodes.json ] || gunzip -c solsys_code/tests/data/ObsCodes.json.gz > ~/.cache/sorcha/ObsCodes.json
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: Run Django unit tests with coverage
      run: |
        coverage run manage.py test --exclude-tag functional
        coverage xml
    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  functional-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Cache SPICE kernels
      uses: actions/cache@v6
      with:
        path: ~/.cache/sorcha
        key: sorcha-kernels-v1
    - name: Seed MPC observatory codes
      run: |
        mkdir -p ~/.cache/sorcha
        [ -f ~/.cache/sorcha/ObsCodes.json ] || gunzip -c solsys_code/tests/data/ObsCodes.json.gz > ~/.cache/sorcha/ObsCodes.json
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
    - name: Install Playwright chromium
      timeout-minutes: 10
      run: |
        playwright install --with-deps chromium
    - name: Run Playwright functional tests
      run: |
        python manage.py test --tag functional
