
# This workflow will install Python dependencies, build the package and then build the documentation.

name: Build documentation


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Cache SPICE kernels
      # The scout_lifecycle_exploration notebook imports solsys_code.ephem_utils, which downloads
      # 1.6 GB of SPICE kernels at import.
      uses: actions/cache@v6
      with:
        path: ~/.cache/sorcha
        key: sorcha-kernels-v1
    - name: Seed MPC observatory codes
      # sorcha only downloads ObsCodes.json from minorplanetcenter.net when it is missing from its
      # cache, and MPC intermittently drops connections from GitHub runners; seed it from the repo.
      run: |
        mkdir -p ~/.cache/sorcha
        [ -f ~/.cache/sorcha/ObsCodes.json ] || gunzip -c solsys_code/tests/data/ObsCodes.json.gz > ~/.cache/sorcha/ObsCodes.json
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        uv pip install --system -e .
        if [ -f docs/requirements.txt ]; then uv pip install --system -r docs/requirements.txt; fi
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: Install notebook requirements
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt-get install pandoc
    - name: Build docs
      timeout-minutes: 8
      run: |
        sphinx-build -T -E -b html -d docs/build/doctrees ./docs docs/build/html
