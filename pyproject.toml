
[project]
name = "fomo"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "SSSC FOMO Software Developers", email = "fomo@lco.global" }
]
description = "Follow-up Observations of Moving Objects"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "tomtoolkit>=3.1.0",
    "tom_alertstreams>=1.3.0",
    "tom_fink>=2.0.1",
    "tom_eso>=0.3.1",
    "tom_jpl>=0.3.0",
    "numpy>1.24",
    "sbpy>=0.6.0",  # We don't use sbpy directly, but sorcha does and sbpy 0.6.0 is needed for astropy 7.2.0+
    "sorcha",
    "whitenoise>=6.6", # Serves collected static files when DEBUG=False (no separate web server needed)
]

[project.urls]
"Source Code" = "https://github.com/lsst-sssc/fomo"

[project.optional-dependencies]
deploy = [
    "gunicorn>=23", # Production WSGI server; see deploy/install_service.sh
]
# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
dev = [
    "factory_boy >3.2.1,<3.4", # Provides  Test fixtures for tom_jpl model factories (and tom_targets factories)
    "ipython",
    "jupyter", # Clears output from Jupyter notebooks
    "playwright", # Headless-browser functional tests (solsys_code/tests/test_bootstrap5_rendering.py)
    "coverage", # Used to report total code coverage of the Django test suite
    "pre-commit", # Used to run checks before finalizing a git commit
    "ruff>=0.16", # Static linting/formatting; keep the floor in step with the ruff-pre-commit rev in .pre-commit-config.yaml
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/fomo/_version.py"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["solsys_code/**/migrations/*.py", ]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # Pyflakes
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM105", # Prefer `try`-`except`-`pass` to contextlib.suppress
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
    # From Rubin DM "suggestions" for Science Pipelines
    # (https://developer.lsst.io/python/style.html#ruff-configuration-files)
    "N802",
    "N803",
    "N806",
    "N812",
    "N813",
    "N815",
    "N816",
    "N999",
]

# 4. Ignore `D101` and `D102` (missing docs strings) in all tests subdirectories.
[tool.ruff.lint.per-file-ignores]
"solsys_code/**/{apps,tests}.py" = ["D101", "D102"]
"solsys_code/*/migrations/*.py" = ["D100", "D101", "D102", "D103", "E501", "RUF012"]
"**/tests/*" = ["D101", "D102"]

[tool.coverage.run]
source = ["solsys_code", "src/fomo", "src/templatetags"]
omit = ["src/fomo/_version.py", "*/migrations/*", "*/tests/*"]
